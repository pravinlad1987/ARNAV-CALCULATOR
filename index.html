<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARNAV CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: black;color: white;">
    <h1>Arnav's Calculator</h1>
    <p>Welcome to my calculator!</p>
    <div class="calculator">
        <input type="text" id="display" readonly>  
      <div>
        <button onclick="addNumber(7)">7</button>
        <button onclick="addNumber(8)">8</button>
        <button onclick="addNumber(9)">9</button>
        
        <button class="operator" onclick="addOperator('/')">&divide;</button>
      </div>
      <div>
         <button onclick="addNumber(4)">4</button>
        <button onclick="addNumber(5)">5</button>
        <button onclick="addNumber(6)">6</button>
        <button class="operator" onclick="addOperator('*')">&times;</button>
      </div>
      <div>
       <button onclick="addNumber(1)">1</button>
        <button onclick="addNumber(2)">2</button>
        <button onclick="addNumber(3)">3</button>
        <button class="operator" onclick="addOperator('-')">&minus;</button>
      </div>
      <div>
        <button onclick="addNumber(0)">0</button>
        <button onclick="clearDisplay()">c</button>
        <button onclick="calculate()">=</button>
        <button class="operator" onclick="addOperator('+')">+</button>
      </div>
    
    </div>
      <script src="script.js"></script>
</body>
</html>
